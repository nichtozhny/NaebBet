<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Мобильный viewport: без масштабирования, с учётом "чёлки" -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0714">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NaebBet — офлайн-казино на виртуальные NB-монеты. Реальных денег нет.">

  <!-- PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NaebBet">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">

  <!-- Иконка вкладки: inline SVG, без внешних файлов -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0714'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0714'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle'%3E%F0%9F%8E%B0%3C/text%3E%3C/svg%3E">

  <title>NaebBet — офлайн-казино</title>

  <!-- Стили -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/games.css">
</head>
<body>

  <!-- Экран-заставка -->
  <div id="splash" class="splash" role="status" aria-live="polite">
    <div class="splash__inner">
      <svg class="splash__logo" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true">
        <defs>
          <linearGradient id="splashGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe27a"/>
            <stop offset="1" stop-color="#e0a100"/>
          </linearGradient>
          <linearGradient id="splashViolet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b86bff"/>
            <stop offset="1" stop-color="#6a22d8"/>
          </linearGradient>
        </defs>
        <circle cx="60" cy="60" r="54" fill="#140a26" stroke="url(#splashViolet)" stroke-width="4"/>
        <circle cx="60" cy="60" r="42" fill="none" stroke="url(#splashGold)" stroke-width="3" stroke-dasharray="6 6"/>
        <text x="60" y="76" font-size="44" text-anchor="middle">🎰</text>
      </svg>
      <div class="splash__title"><span class="splash__naeb">Naeb</span><span class="splash__bet">Bet</span></div>
      <div class="splash__sub">Виртуальное казино · NB-монеты</div>
      <div class="splash__bar"><div class="splash__bar-fill" id="splash-progress"></div></div>
      <div class="splash__note">Реальных денег нет. Только для развлечения.</div>
    </div>
  </div>

  <!-- Приложение -->
  <div id="app" class="app nb-app has-nav" aria-hidden="true">

    <!-- Шапка: баланс, уровень с полоской XP, звук -->
    <header id="header" class="header nb-header">
      <div class="header__balance" id="header-balance-wrap">
        <span class="header__coin" aria-hidden="true">🪙</span>
        <div class="header__balance-text">
          <span class="header__label">Баланс</span>
          <span class="header__balance-value" id="header-balance">0</span>
        </div>
      </div>

      <div class="header__level" id="header-level" role="button" tabindex="0" aria-label="Уровень игрока">
        <div class="header__level-top">
          <span class="header__level-badge" id="header-level-num">1</span>
          <span class="header__level-title" id="header-level-title">Новичок</span>
        </div>
        <div class="xpbar" aria-hidden="true">
          <div class="xpbar__fill" id="header-xp-fill"></div>
        </div>
      </div>

      <button type="button" class="header__sound" id="btn-sound" aria-label="Включить или выключить звук" aria-pressed="false">
        <span id="btn-sound-icon" aria-hidden="true">🔊</span>
      </button>
    </header>

    <!-- Основной контейнер экранов: именно он прокручивается (см. #screen в css/base.css) -->
    <main id="screen" class="screen nb-screen" tabindex="-1"></main>

    <!-- Нижняя навигация: плавающая (position:absolute), экран резервирует под неё место -->
    <nav id="nav" class="nav nb-nav" aria-label="Основная навигация">
      <button type="button" class="nav__item is-active" data-screen="lobby" aria-label="Игры">
        <span class="nav__icon" aria-hidden="true">🎰</span>
        <span class="nav__text">Игры</span>
      </button>
      <button type="button" class="nav__item" data-screen="stats" aria-label="Статистика">
        <span class="nav__icon" aria-hidden="true">📊</span>
        <span class="nav__text">Статистика</span>
      </button>
      <button type="button" class="nav__item" data-screen="achievements" aria-label="Награды">
        <span class="nav__icon" aria-hidden="true">🏆</span>
        <span class="nav__text">Награды</span>
      </button>
      <button type="button" class="nav__item" data-screen="settings" aria-label="Ещё">
        <span class="nav__icon" aria-hidden="true">⚙️</span>
        <span class="nav__text">Ещё</span>
      </button>
    </nav>
  </div>

  <!-- Контейнеры уведомлений и модальных окон -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root" class="modal-root"></div>

  <noscript>
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0714;color:#fff;padding:24px;text-align:center;font-family:sans-serif;z-index:99999">
      Для работы NaebBet необходим включённый JavaScript.
    </div>
  </noscript>

  <!-- ===== Ядро (порядок важен) ===== -->
  <script src="js/core/namespace.js"></script>
  <script src="js/core/events.js"></script>
  <script src="js/core/games.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/rng.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/wallet.js"></script>
  <script src="js/core/stats.js"></script>
  <script src="js/core/levels.js"></script>
  <script src="js/core/achievements.js"></script>
  <script src="js/core/bonuses.js"></script>
  <script src="js/core/rules.js"></script>
  <script src="js/core/router.js"></script>

  <!-- ===== Игры ===== -->
  <script src="js/games/slots.js"></script>
  <script src="js/games/roulette.js"></script>
  <script src="js/games/blackjack.js"></script>
  <script src="js/games/dice.js"></script>
  <script src="js/games/coinflip.js"></script>
  <script src="js/games/crash.js"></script>
  <script src="js/games/mines.js"></script>
  <script src="js/games/plinko.js"></script>

  <!-- ===== Экраны ===== -->
  <script src="js/screens/lobby.js"></script>
  <script src="js/screens/games.js"></script>
  <script src="js/screens/game.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/bank.js"></script>
  <script src="js/screens/more.js"></script>
  <script src="js/screens/rules.js"></script>

  <!-- ===== Точка входа ===== -->
  <script src="js/main.js"></script>

  <!-- Страховка заставки и регистрация service worker -->
  <script>
  (function () {
    'use strict';

    // Страховка: если main.js не скрыл заставку (например, из-за ошибки) — убираем её сами через 5 секунд
    function hideSplashFallback() {
      var splash = document.getElementById('splash');
      var app = document.getElementById('app');
      if (splash && !splash.classList.contains('is-hidden')) {
        splash.classList.add('is-hidden');
        setTimeout(function () {
          if (splash.parentNode) { splash.parentNode.removeChild(splash); }
        }, 600);
      }
      if (app) { app.removeAttribute('aria-hidden'); }
    }
    setTimeout(hideSplashFallback, 5000);

    // Заполнение прогресс-бара заставки (чисто визуальное)
    var fill = document.getElementById('splash-progress');
    if (fill) {
      requestAnimationFrame(function () { fill.style.width = '100%'; });
    }

    // Регистрация service worker для офлайн-работы
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // Сообщаем приложению о готовности офлайн-режима, если NB.Events уже доступен
          if (window.NB && NB.Events && typeof NB.Events.emit === 'function') {
            NB.Events.emit('sw:registered', { scope: reg.scope });
          }
        }).catch(function (err) {
          if (window.console) { console.warn('[NaebBet] Service worker не зарегистрирован:', err); }
        });
      });
    }
  })();
  </script>
</body>
</html>
